version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /frontend
      - /database/misc
      - /sidelined/elo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Keep packages with peer/version coupling reviewable together.
      firebase:
        patterns:
          - firebase
          - firebase-admin
          - firebase-functions
          - "@firebase/rules-unit-testing"
      next:
        patterns:
          - next
          - eslint-config-next
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      routine:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
