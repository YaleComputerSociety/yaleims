name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Recheck published advisories even when the lockfiles have not changed.
    - cron: "0 14 * * 1"

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    name: Dependency advisories (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, database/misc, sidelined/elo]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Scan all locked dependencies, including development and optional ones.
      # No install scripts, credentials, severity exclusions, or automatic fixes.
      - run: npm audit --package-lock-only --audit-level=low

  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Errors fail the job; warnings are reported but allowed.
      - run: npm run lint
      # Builds without any env vars or secrets (verified from a clean clone).
      - run: npm run build

  integration:
    name: Integration and rules tests (emulator)
    runs-on: ubuntu-latest
    # About 3 minutes; a hang fails here, not after GitHub's 6 hours.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # A demo- project never reaches a real Firebase project.
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-yims
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Seeds the emulator, starts the app on it, runs tests/integration and tests/rules.
      - run: npm run test:emulator

  sidelined-elo:
    name: Sidelined Elo (type-check, import guard)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sidelined/elo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidelined/elo/package-lock.json
      - run: npm ci
      # Elo code is switched off (sidelined/elo/README.md): keep it compiling,
      # and make sure nothing in the app imports it.
      - run: npm run typecheck
      - run: npm run check:not-imported
