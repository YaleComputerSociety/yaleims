name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # Errors fail the job; warnings are reported but allowed.
      - run: npm run lint
      # Builds without any env vars or secrets (verified from a clean clone).
      - run: npm run build

  functions:
    name: Cloud Functions (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database/functions
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: database/functions/package-lock.json
      - run: npm ci
      - run: npm run build
      # Elo code is switched off (src/sidelined/elo/README.md): keep it compiling,
      # and make sure nothing pulls it back into the deployed build.
      - run: npm run typecheck:sidelined
      - run: npm run check:sidelined
